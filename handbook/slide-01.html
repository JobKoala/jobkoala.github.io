 *{margin:0;padding:0;box-sizing:border-box}
 html,body{width:1360px;height:765px;overflow:hidden}
 body{font-family:-apple-system,"SF Pro Display","PingFang SC",sans-serif;
   background:linear-gradient(150deg,#F4F8FF 0%,#EAF1FC 46%,#E2ECFA 100%);
   position:relative;display:flex;align-items:center}
 /* 背景弧线，和启动页同一种语言 */
 .arcs{position:absolute;inset:0;overflow:hidden}
 .arcs i{position:absolute;border:1px solid rgba(120,165,230,.16);border-radius:50%;display:block}
 .a1{width:1500px;height:1500px;left:-380px;top:-760px}
 .a2{width:1180px;height:1180px;left:-210px;top:-560px}
 .a3{width:900px;height:900px;left:-60px;top:-380px}
 .spark{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;
   box-shadow:0 0 10px 3px rgba(255,255,255,.9)}

 .left{position:relative;z-index:2;padding-left:104px;width:700px}
 .brand{display:flex;align-items:center;gap:13px}
 .brand img{width:46px;height:46px;border-radius:50%}
 .brand b{font-size:19px;font-weight:800;color:#12275C;letter-spacing:.02em}
 h1{margin-top:38px;font-size:66px;font-weight:800;color:#0E1F4A;line-height:1.06;
   letter-spacing:-.025em}
 h1 em{font-style:normal;color:#1C62E2}
 .sub{margin-top:18px;font-size:17px;color:#4A5B7C;letter-spacing:.01em}
 .rule{margin-top:34px;width:64px;height:3px;border-radius:2px;background:#1C62E2}
 /* 双向流动:一行高，塞在蓝线和元数据之间，不动其它任何元素 */
 .flow{margin-top:30px;display:flex;align-items:center;gap:14px}
 .flow .ic{width:44px;height:44px;border-radius:50%;background:#fff;flex:none;
   display:flex;align-items:center;justify-content:center}
 .flow .ic.s{box-shadow:0 6px 16px -10px rgba(28,98,226,.7),0 0 0 1.2px #C7D9F6}
 .flow .ic.e{box-shadow:0 6px 16px -10px rgba(224,138,23,.7),0 0 0 1.2px #F0DCB4}
 .flow .ic svg{width:21px;height:21px;fill:none;stroke-width:1.7;stroke-linecap:round;
   stroke-linejoin:round}
 .flow .ic.s svg{stroke:#1C62E2} .flow .ic.e svg{stroke:#B4720E}
 .flow .mid{flex:none;text-align:center}
 .flow .mid svg{display:block;width:118px;height:26px;overflow:visible}
 .flow .lb{font-size:12.5px;font-weight:800;color:#0E1F4A;white-space:nowrap}
 .meta{margin-top:30px;display:flex;gap:30px}
 .meta div b{display:block;font-size:11px;font-weight:800;letter-spacing:.14em;color:#93A4C2}
 .meta div s{text-decoration:none;display:block;font-size:14px;font-weight:700;color:#1B3160;margin-top:5px}

 /* ── 手机:启动页 ── */
 .right{position:relative;z-index:2;flex:1;display:flex;justify-content:center}
 .phone{width:252px;background:#2E333B;border-radius:34px;padding:6px;
   box-shadow:0 40px 70px -30px rgba(20,40,90,.45),0 12px 28px -14px rgba(20,40,90,.3)}
 .screen{height:530px;border-radius:28px;overflow:hidden;position:relative;
   background:linear-gradient(165deg,#EEF4FF 0%,#E4EDFB 52%,#DCE8F8 100%);
   display:flex;flex-direction:column;align-items:center}
 
 .s1{width:420px;height:420px;left:-84px;top:-118px}
 .s2{width:330px;height:330px;left:-38px;top:-70px}
 .sbar{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;
   justify-content:space-between;padding:0 16px;font-size:10px;font-weight:700;color:#12275C;z-index:3}
 .sbar svg{width:34px;height:11px;display:block}
 .garc{position:absolute;left:-66px;top:-86px;width:230px;height:214px;border-radius:50%;
   background:linear-gradient(135deg,#DEEAFD,#F4F8FF);z-index:1}
 .glogo{width:86px;height:86px;border-radius:50%;margin-top:138px;position:relative;z-index:2;
   box-shadow:0 16px 30px -14px rgba(32,70,200,.5)}
 .gname{margin-top:22px;font-size:31px;font-weight:800;font-style:italic;letter-spacing:-.015em;
   position:relative;z-index:2}
 .gname i{font-style:inherit}
 .gname .j{color:#2B4BE8}
 .gname .a{color:#EE2C56}
 .gtag2{margin-top:15px;font-size:13.5px;font-weight:700;color:#3C4A63;position:relative;z-index:2}
 .gsw{margin-top:5px;width:104px;height:9px;position:relative;z-index:2}
 .sky{position:absolute;left:0;right:0;bottom:52px;width:100%;height:58px;z-index:1}
 .wv{position:absolute;left:0;right:0;bottom:0;width:100%;height:132px;z-index:1}
 .scat{position:absolute;inset:0;z-index:1;pointer-events:none}
 .scat b{position:absolute;display:flex;align-items:center;justify-content:center;
   border-radius:29%;box-shadow:0 15px 32px -15px rgba(18,48,108,.48),
   0 0 0 1px rgba(150,180,225,.18)}
 .scat b svg{width:58%;height:58%;display:block}
